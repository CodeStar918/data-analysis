services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: report_platform
      POSTGRES_USER: report
      POSTGRES_PASSWORD: report123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://report:report123@postgres:5432/report_platform
      JWT_SECRET: change-me-in-production
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.core.celery_app worker -l info
    environment:
      DATABASE_URL: postgresql+psycopg://report:report123@postgres:5432/report_platform
      JWT_SECRET: change-me-in-production
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
